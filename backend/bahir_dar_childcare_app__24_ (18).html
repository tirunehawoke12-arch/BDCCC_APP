function renderYearEvaluation(records){
  if(!records.length) return '';
  const passSet = ['አልፏል','ወደ ቀጣይ ክፍል ተዛውሯል','ወደ ቀጣይ ክፍል ተዛውራለች'];
  const failSet = ['ወድቋል','አልተዛወረም','አልተዛወረችም'];
  function classify(rec){
    const val = rec.promoted;
    if(!val || val==='በሂደት ላይ' || val==='ወደ ቀጣይ ክፍል ተዛውሯል/ተዛውራለች' || val==='አልተዛወረም/አልተዛወረችም') return 'pending';
    if(passSet.includes(val)) return 'pass';
    if(failSet.includes(val)) return 'fail';
    return 'pending';
  }
  const levels = [...new Set(records.map(r=>r.level).filter(Boolean))];
  const perLevel = levels.map(level=>{
    const recs = records.filter(r=>r.level===level);
    const pass = recs.filter(r=>classify(r)==='pass').length;
    const fail = recs.filter(r=>classify(r)==='fail').length;
    const pending = recs.filter(r=>classify(r)==='pending').length;
    const decided = pass+fail;
    const passPct = decided ? Math.round((pass/decided)*100) : 0;
    return {level, total:recs.length, pass, fail, pending, passPct};
  });
  const totalAll = records.length;
  const passAll = records.filter(r=>classify(r)==='pass').length;
  const failAll = records.filter(r=>classify(r)==='fail').length;
  const pendingAll = records.filter(r=>classify(r)==='pending').length;
  const decidedAll = passAll+failAll;
  const passPctAll = decidedAll ? Math.round((passAll/decidedAll)*100) : 0;
  return `
    <div class="table-wrap" style="padding:24px 26px;">
      <h3 style="margin:0 0 16px; font-size:16px; color:var(--lake);">${ICONS.history} ራስ-ሰር ግምገማ</h3>
      ${pendingAll>0
        ? `<p style="font-size:13px; color:var(--danger); font-weight:600; margin-bottom:16px;">⚠ ${pendingAll} ተማሪ(ዎች) ውጤት/ማዘዋወር ውሳኔ በመጠባበቅ ላይ ስላለ ግምገማው እስካሁን ያልተሟላ ነው።</p>`
        : `<p style="font-size:13px; color:var(--leaf); font-weight:600; margin-bottom:16px;">✓ የ${totalAll} ተማሪዎች ውጤት ሙሉ በሙሉ ገብቷል</p>`}
      <div class="kpi-grid" style="margin-bottom:20px;">
        <div class="kpi" style="cursor:default;"><div class="kpi-num">${totalAll}</div><div class="kpi-lbl">ጠቅላላ የተመዘገቡ ተማሪ</div></div>
        <div class="kpi" style="cursor:default;"><div class="kpi-num" style="color:var(--leaf);">${passAll}</div><div class="kpi-lbl">ወደ ቀጣይ የተዛወሩ</div></div>
        <div class="kpi" style="cursor:default;"><div class="kpi-num" style="color:var(--danger);">${failAll}</div><div class="kpi-lbl">ያልተዛወሩ</div></div>
        <div class="kpi" style="cursor:default;"><div class="kpi-num">${passPctAll}%</div><div class="kpi-lbl">አጠቃላይ የማዕከሉ የማለፍ መጠን</div></div>
      </div>
      <h4 style="margin:0 0 10px; font-size:13.5px; color:var(--ink);">በየትምህርት ደረጃው ዝርዝር</h4>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ደረጃ</th><th>ጠቅላላ</th><th>ወደ ቀጣይ የተዛወሩ</th><th>ያልተዛወሩ</th><th>በመጠባበቅ ላይ</th><th>የማለፍ መቶኛ</th></tr></thead>
          <tbody>
          ${perLevel.map(pl=>`<tr>
            <td>${esc(pl.level)}</td>
            <td class="mono">${pl.total}</td>
            <td class="mono" style="color:var(--leaf);">${pl.pass}</td>
            <td class="mono" style="color:var(--danger);">${pl.fail}</td>
            <td class="mono">${pl.pending}</td>
            <td class="mono">${pl.passPct}%</td>
          </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

async function exportSectionToExcel(entityKey){
  if(typeof ExcelJS==='undefined'){ showToast('የExcel ላይብረሪ አልተጫነም፣ ትንሽ ቆይተው ይሞክሩ'); return; }
  try{
    const cfg = ENTITIES[entityKey];
    const plainFields = cfg.fields.filter(f=>f.type!=='file');
    const docFields = cfg.fields.filter(f=>f.type==='file');
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet(cfg.label.slice(0,28));
    const cols = [{header:'ID', key:'regId', width:16}, {header:'ፎቶ', key:'photoCol', width:12},
      ...plainFields.map(f=>({header:f.label, key:f.key, width: f.type==='textarea'?30:18})),
      ...docFields.map(f=>({header:f.label, key:'doc_'+f.key, width:14}))];
    ws.columns = cols;
    ws.getRow(1).font = {bold:true};
    const photoColIdx = 2;
    const docColStart = 2 + plainFields.length + 1;
    DATA[entityKey].forEach(r=>{
      const rowObj = {regId: r.regId || r.id};
      plainFields.forEach(f=> rowObj[f.key] = r[f.key] || '');
      docFields.forEach(f=>{ rowObj['doc_'+f.key] = (r[f.key] && !isImageDataUrl(r[f.key])) ? 'PDF ተያይዟል' : ''; });
      const row = ws.addRow(rowObj);
      row.height = 42;
      if(r.photo){
        const imgId = addImageSafe(wb, r.photo);
        if(imgId!==null) ws.addImage(imgId, {tl:{col:photoColIdx-1, row:row.number-1}, ext:{width:34,height:34}});
      }
      docFields.forEach((f,i)=>{
        if(r[f.key] && isImageDataUrl(r[f.key])){
          const imgId2 = addImageSafe(wb, r[f.key]);
          if(imgId2!==null) ws.addImage(imgId2, {tl:{col:docColStart+i-1, row:row.number-1}, ext:{width:34,height:34}});
        }
      });
    });
    await saveOrDownloadWorkbook(wb, `${cfg.label}.xlsx`);
  }catch(e){ showToast('Excel ማውጣት አልተቻለም'); }
}
async function exportAllToWorkbook(){
  if(typeof ExcelJS==='undefined'){ showToast('የExcel ላይብረሪ አልተጫነም፣ ትንሽ ቆይተው ይሞክሩ'); return; }
  try{
    const wb = await buildAllWorkbook();
    await saveOrDownloadWorkbook(wb, `ባህር_ዳር_ህፃናት_መርጃ_ማዕከል_${new Date().toISOString().slice(0,10)}.xlsx`);
  }catch(e){ showToast('Excel ማውጣት አልተቻለም'); }
}

function renderField(f, rec){
  const val = rec[f.key] !== undefined ? rec[f.key] : '';
  const isFull = f.col==='full';
  const colClass = (isFull && !f.showIf) ? 'full' : '';
  let inner;
  if(f.key==='currentGrade'){
    const opts = GRADE_OPTIONS_BY_LEVEL[rec.educationLevel] || [];
    inner = `<div class="field ${colClass}"><label>${f.label}</label>
      <select id="f_${f.key}">
        <option value="">${rec.educationLevel ? '-- ይምረጡ --' : 'መጀመሪያ የትምህርት ደረጃ ይምረጡ'}</option>
        ${opts.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}
      </select></div>`;
  } else if(f.type==='file'){
    const docVal = pendingDocs[f.key] !== undefined ? pendingDocs[f.key] : (rec[f.key] || null);
    inner = `<div class="field ${colClass}">
      <label>${f.label}</label>
      <div class="photo-uploader">
        <span id="docChip_${f.key}">${docVal ? `<div class="file-chip">${ICONS.file} ፋይል ተያይዟል</div>` : `<div class="file-chip muted">ምንም ፋይል የለም</div>`}</span>
        <label class="file-btn">ፋይል ምረጥ<input type="file" data-docfield="${f.key}" accept="image/*,.pdf" style="display:none;"></label>
      </div>
    </div>`;
  } else if(f.type==='select'){
    inner = `<div class="field ${colClass}"><label>${f.label}${f.required?' *':''}</label>
      <select id="f_${f.key}">
        <option value="">-- ይምረጡ --</option>
        ${f.options.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}
      </select></div>`;
  } else if(f.type==='textarea'){
    inner = `<div class="field ${colClass}"><label>${f.label}</label><textarea id="f_${f.key}">${esc(val)}</textarea></div>`;
  } else {
    const ruleAttr = (f.rule && f.type==='text') ? ` data-rule="${f.rule}" inputmode="${f.rule==='numeric'?'numeric':'text'}"` : '';
    inner = `<div class="field ${colClass}"><label>${f.label}${f.required?' *':''}</label><input type="${f.type}" id="f_${f.key}" value="${esc(val)}"${ruleAttr}></div>`;
  }
  if(f.showIf){
    const visible = rec[f.showIf.key] === f.showIf.value;
    return `<div class="${isFull?'full':''}" data-cond-key="${f.showIf.key}" data-cond-value="${esc(f.showIf.value)}" style="display:${visible?'block':'none'};">${inner}</div>`;
  }
  return inner;
}

function renderAcademicField(f, rec, gender){

  if(f.type==='hidden'){
    return `<input type="hidden" id="af_${f.key}" value="${esc(val)}">`;
  }
  if(f.key==='gradeOrYear'){
    const opts = GRADE_OPTIONS_BY_LEVEL[rec.level] || [];
    return `<div class="field ${colClass}"><label>${f.label}${f.required?' *':''}</label>
      <select id="af_${f.key}">
        <option value="">${rec.level ? '-- ይምረጡ --' : 'መጀመሪያ የትምህርት ደረጃ ይምረጡ'}</option>
        ${opts.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}
      </select></div>`;
  }
  if(f.key==='average'){
    const isUni = rec.level==='ዩኒቨርሲቲ';
    const maxAllowed = isUni ? 4 : 100;
    const hasVal = val !== '' && val !== undefined && val !== null;
    const choice = rec.resultEntryMode ? rec.resultEntryMode : (hasVal ? 'enter' : 'pending');
    return `<div class="field ${colClass} full">
      <label>ውጤት</label>
      <select id="af_averageChoice" style="margin-bottom:8px;">
        <option value="pending" ${choice==='pending'?'selected':''}>በመጠባበቅ ላይ (ገና ውጤት አልደረሰም)</option>
        <option value="enter" ${choice==='enter'?'selected':''}>ውጤት አስገባ</option>
      </select>
      <div id="af_averageWrap" style="${choice==='pending'?'display:none;':''}">
        <label style="display:block; font-size:12.5px; font-weight:600; margin:10px 0 6px;">${isUni ? 'አማካይ ውጤት (GPA ከ4.00 አይበልጥም)' : 'አማካይ ውጤት (ከ100 አይበልጥም)'}</label>
        <input type="number" id="af_average" value="${esc(val)}" min="0" max="${maxAllowed}" step="${isUni?'0.01':'0.1'}" placeholder="${isUni ? 'ለምሳሌ 3.50' : 'ለምሳሌ 87'}">
      </div>
    </div>`;
  }
  if(f.key==='rank' || f.key==='promoted' || f.type==='file'){
    const hasVal = rec.average !== '' && rec.average !== undefined && rec.average !== null;
    const choice = rec.resultEntryMode ? rec.resultEntryMode : (hasVal ? 'enter' : 'pending');
    const displayStyle = choice==='pending' ? 'display:none;' : '';
    let body;
    if(f.key==='promoted'){
      body = `<div class="field ${colClass}"><label>${f.label}</label>
        <select id="af_${f.key}">
          ${buildPromotedOptionsHtml(val, gender)}
        </select></div>`;
    } else if(f.type==='file'){
      const docVal = pendingAcadDoc !== null ? pendingAcadDoc : (rec[f.key] || null);
      body = `<div class="field ${colClass}">
        <label>${f.label}</label>
        <div class="photo-uploader">
          <span id="acadDocSlot">${docVal ? `<a href="${docVal}" target="_blank" rel="noopener" class="file-chip">${ICONS.file} ፋይሉን ክፈት</a>` : `<div class="file-chip muted">ምንም ፋይል የለም</div>`}</span>
          <label class="file-btn">ፋይል ምረጥ<input type="file" data-acaddocfield="1" accept="image/*,.pdf" style="display:none;"></label>
        </div>
      </div>`;
    } else {
      body = `<div class="field ${colClass}"><label>${f.label}${f.required?' *':''}</label><input type="text" id="af_${f.key}" value="${esc(val)}"></div>`;
    }
    return `<div id="af_${f.key}Wrap" style="${displayStyle}">${body}</div>`;
  }
  if(f.type==='select'){
    return `<div class="field ${colClass}"><label>${f.label}${f.required?' *':''}</label>
      <select id="af_${f.key}">
        <option value="">-- ይምረጡ --</option>
        ${f.options.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}
      </select></div>`;
  }
  if(f.type==='textarea'){
    return `<div class="field ${colClass}"><label>${f.label}</label><textarea id="af_${f.key}">${esc(val)}</textarea></div>`;
  }
  const ruleAttr = (f.rule && f.type==='text') ? ` data-rule="${f.rule}" inputmode="${f.rule==='numeric'?'numeric':'text'}"` : '';
  const listAttr = f.key==='studentFullName' ? ` list="childNameList" autocomplete="off"` : '';
  return `<div class="field ${colClass}"><label>${f.label}${f.required?' *':''}</label><input type="${f.type}" id="af_${f.key}" value="${esc(val)}"${ruleAttr}${listAttr}></div>`;
}

/* ---------- events ---------- */
function attachEvents(){
  // enforce numeric-only / letters-only typing on any input marked with data-rule
  document.querySelectorAll('input[data-rule]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const start = el.selectionStart, before = el.value;
      if(el.getAttribute('data-rule')==='numeric'){
        el.value = el.value.replace(/[^0-9.]/g, '');
      } else if(el.getAttribute('data-rule')==='letters'){
        el.value = el.value.replace(/[0-9]/g, '');
      }
      if(el.value !== before && start !== null){
        const diff = before.length - el.value.length;
        try{ el.setSelectionRange(start-diff, start-diff); }catch(e){}
      }
    });
  });

  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{
      const target = el.getAttribute('data-nav');
      if(target !== VIEW) pushHistory();
      VIEW = target; if(VIEW==='dashboard'&&!SESSION){VIEW='login';} render();
    };
  });
  const installAppBtn = document.getElementById('installAppBtn');
  if(installAppBtn) installAppBtn.onclick = async ()=>{
    if(!window.__deferredInstallPrompt) return;
    window.__deferredInstallPrompt.prompt();
    try{ await window.__deferredInstallPrompt.userChoice; }catch(e){}
    window.__deferredInstallPrompt = null;
    render();
  };
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.onclick = ()=>{ SESSION=false; VIEW='home'; NAV_HISTORY=[]; render(); showToast('ወጥተዋል'); };
  const adminChipBtn = document.getElementById('adminChipBtn');
  if(adminChipBtn) adminChipBtn.onclick = ()=>{ if(VIEW!=='dashboard' || DASH_VIEW!=='settings') pushHistory(); VIEW='dashboard'; DASH_VIEW='settings'; render(); };

  document.querySelectorAll('[data-dash]').forEach(el=>{
    el.onclick = ()=>{
      const target = el.getAttribute('data-dash');
      if(target !== DASH_VIEW) pushHistory();
      if(target === 'exceldash') { EXCEL_SECTION = null; EXCEL_SEARCH = ''; }
      DASH_VIEW = target; SEARCH=''; render();
    };
  });

  const calPrevBtn = document.getElementById('calPrevBtn');
  if(calPrevBtn) calPrevBtn.onclick = ()=>{
    if(!CAL_VIEW) CAL_VIEW = todayEthiopian();
    CAL_VIEW.month -= 1;
    if(CAL_VIEW.month < 1){ CAL_VIEW.month = 13; CAL_VIEW.year -= 1; }
    render();
  };
  const calNextBtn = document.getElementById('calNextBtn');
  if(calNextBtn) calNextBtn.onclick = ()=>{
    if(!CAL_VIEW) CAL_VIEW = todayEthiopian();
    CAL_VIEW.month += 1;
    if(CAL_VIEW.month > 13){ CAL_VIEW.month = 1; CAL_VIEW.year += 1; }
    render();
  };
  const calTodayBtn = document.getElementById('calTodayBtn');
  if(calTodayBtn) calTodayBtn.onclick = ()=>{ CAL_VIEW = todayEthiopian(); render(); };
  document.querySelectorAll('[data-cal-day]').forEach(el=>{
    el.onclick = ()=>{
      const day = parseInt(el.getAttribute('data-cal-day'), 10);
      CAL_DAY_MODAL = {year:CAL_VIEW.year, month:CAL_VIEW.month, day};
      render();
    };
  });
  document.querySelectorAll('[data-cal-note-jump]').forEach(el=>{
    el.onclick = ()=>{
      const [y,m,d] = el.getAttribute('data-cal-note-jump').split(':').map(Number);
      CAL_VIEW = {year:y, month:m};
      CAL_DAY_MODAL = {year:y, month:m, day:d};
      render();
    };
  });
  const calNoteModalBg = document.getElementById('calNoteModalBg');
  if(calNoteModalBg) calNoteModalBg.onclick = (e)=>{ if(e.target.id==='calNoteModalBg'){ CAL_DAY_MODAL=null; render(); } };
  const calNoteCancelBtn = document.getElementById('calNoteCancelBtn');
  if(calNoteCancelBtn) calNoteCancelBtn.onclick = ()=>{ CAL_DAY_MODAL=null; render(); };
  const calNoteSaveBtn = document.getElementById('calNoteSaveBtn');
  if(calNoteSaveBtn) calNoteSaveBtn.onclick = async ()=>{

    const record = DATA[entity].find(r=>r.id===id);
    DATA[entity] = DATA[entity].filter(r=>r.id!==id);
    await deleteRecord(entity, id);
    if(record) await moveToTrash(entity, record);
    confirmState=null;
    render();
    showToast('ወደ ቆሻሻ መጣያ ተልኳል — ለ'+TRASH_RETENTION_DAYS+' ቀናት ተመልሶ ማግኘት ይቻላል');
  };

  document.querySelectorAll('[data-trash-restore]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.getAttribute('data-trash-restore');
      await restoreFromTrash(id);
      render();
      showToast('ተመልሷል');
    };
  });
  document.querySelectorAll('[data-trash-purge]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.getAttribute('data-trash-purge');
      if(!confirm('ይህ መዝገብ ለዘላለም ይጠፋል፣ ከዚያ በኋላ መልሶ ማግኘት አይቻልም። እርግጠኛ ነዎት?')) return;
      await purgeTrashItem(id);
      render();
      showToast('ለዘላለም ጠፍቷል');
    };
  });

  const postSaveBg = document.getElementById('postSaveBg');
  if(postSaveBg) postSaveBg.onclick = (e)=>{ if(e.target.id==='postSaveBg'){ postSavePrompt=null; render(); } };
  const postSaveSkip = document.getElementById('postSaveSkip');
  if(postSaveSkip) postSaveSkip.onclick = ()=>{ postSavePrompt=null; render(); };
  const postSaveNew = document.getElementById('postSaveNew');
  if(postSaveNew) postSaveNew.onclick = async ()=>{
    const {entity, record} = postSavePrompt;
    postSavePrompt = null; render();
    await exportRecordToExcel(entity, record);
  };
  const postSaveAppend = document.getElementById('postSaveAppend');
  if(postSaveAppend) postSaveAppend.onclick = async ()=>{
    const {entity, record} = postSavePrompt;
    postSavePrompt = null; render();
    await appendRecordToExistingExcel(entity, record);
  };

  const saveSettingsBtn = document.getElementById('saveSettingsBtn');
  if(saveSettingsBtn) saveSettingsBtn.onclick = async ()=>{
    const newEmail = document.getElementById('setEmail').value.trim().toLowerCase();
    const p = document.getElementById('setPass').value;
    if(!newEmail || !isValidEmail(newEmail)){ showToast('ትክክለኛ ኢሜይል ያስገቡ (ለምሳሌ የ Gmail አድራሻ)'); return; }
    ADMIN.username = newEmail;
    if(p) ADMIN.password = p;
    await saveCreds();
    document.getElementById('setPass').value = '';
    showToast(p ? 'ኢሜይልና የይለፍ ቃል ተቀይረዋል' : 'ኢሜይል ተቀይሯል');
  };
  const saveBackendBtn = document.getElementById('saveBackendBtn');
  if(saveBackendBtn) saveBackendBtn.onclick = ()=>{
    const url = document.getElementById('backendUrlInput').value.trim();
    const key = document.getElementById('backendKeyInput').value.trim();
    if(!url || !key){ showToast('URL እና API Key ሁለቱንም ያስገቡ'); return; }
    if(!/^https?:\/\//.test(url)){ showToast('URL በ https:// ወይም http:// መጀመር አለበት'); return; }
    localStorage.setItem('bdccc-backend-url', url);
    localStorage.setItem('bdccc-backend-key', key);
    showToast('ተቀምጧል፣ በማጫን ላይ...');
    setTimeout(()=>location.reload(), 700);
  };
  const clearBackendBtn = document.getElementById('clearBackendBtn');
  if(clearBackendBtn) clearBackendBtn.onclick = ()=>{
    if(!confirm('ውሂብ ወደ ዚህ መሳሪያ ብቻ ይመለሳል (ከሰርቨሩ ጋር መመሳሰል ያቆማል)። እርግጠኛ ነዎት?')) return;
    localStorage.removeItem('bdccc-backend-url');
    localStorage.removeItem('bdccc-backend-key');
    setTimeout(()=>location.reload(), 300);
  };
  const saveGoogleClientIdBtn = document.getElementById('saveGoogleClientIdBtn');
  if(saveGoogleClientIdBtn) saveGoogleClientIdBtn.onclick = async ()=>{
    const val = document.getElementById('googleClientIdInput').value.trim();
    GOOGLE_CLIENT_ID = val;
    try{ await window.storage.set('google-client-id', val); }catch(e){}
    render();
    showToast(val ? 'ተቀምጧል' : 'ጠፍቷል');
  };

  const adminPhotoInput = document.getElementById('adminPhotoInput');
  if(adminPhotoInput) adminPhotoInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 2*1024*1024){ showToast('ፎቶው በጣም ትልቅ ነው (ከ2MB በታች ይሞክሩ)'); return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      pendingAdminPhoto = reader.result;
      const slot = document.getElementById('adminPhotoSlot');
      if(slot) slot.innerHTML = `<img class="photo-preview" src="${pendingAdminPhoto}">`;
    };
    reader.readAsDataURL(file);
  };
  const saveProfileBtn = document.getElementById('saveProfileBtn');
  if(saveProfileBtn) saveProfileBtn.onclick = async ()=>{
    ADMIN.name = document.getElementById('profileName').value.trim();
    ADMIN.phone = document.getElementById('profilePhone').value.trim();
    if(pendingAdminPhoto !== null) ADMIN.photo = pendingAdminPhoto;
    await saveCreds();
    pendingAdminPhoto = null;
    render();
    showToast('መገለጫዎ ተቀምጧል');
  };
  const launchWizardBtn = document.getElementById('launchWizardBtn');
  if(launchWizardBtn) launchWizardBtn.onclick = ()=>{ pendingWizardPhoto=null; SETUP_WIZARD = {step:1}; render(); };
  const launchWizardQBtn = document.getElementById('launchWizardQBtn');
  if(launchWizardQBtn) launchWizardQBtn.onclick = ()=>{ pendingWizardPhoto=null; SETUP_WIZARD = {step:4}; render(); };

  const setupWizardBg = document.getElementById('setupWizardBg');
  if(setupWizardBg) setupWizardBg.onclick = (e)=>{ if(e.target.id==='setupWizardBg'){ SETUP_WIZARD=null; pendingWizardPhoto=null; render(); } };
  const wizardPhotoInput = document.getElementById('wizardPhotoInput');
  if(wizardPhotoInput) wizardPhotoInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 2*1024*1024){ showToast('ፎቶው በጣም ትልቅ ነው (ከ2MB በታች ይሞክሩ)'); return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      pendingWizardPhoto = reader.result;
      const slot = document.getElementById('wizardPhotoSlot');
      if(slot) slot.innerHTML = `<img class="photo-preview" src="${pendingWizardPhoto}">`;
    };
    reader.readAsDataURL(file);
  };
  const wizardBack = document.getElementById('wizardBack');
  if(wizardBack) wizardBack.onclick = ()=>{ SETUP_WIZARD.step -= 1; render(); };
  const wizardSkip = document.getElementById('wizardSkip');
  if(wizardSkip) wizardSkip.onclick = ()=>{ SETUP_WIZARD.step += 1; render(); };
  const wizardNext = document.getElementById('wizardNext');
  if(wizardNext) wizardNext.onclick = async ()=>{
    const step = SETUP_WIZARD.step;
    if(step===1){
      ADMIN.name = document.getElementById('wizardName').value.trim();
      ADMIN.phone = document.getElementById('wizardPhone').value.trim();
      if(pendingWizardPhoto !== null) ADMIN.photo = pendingWizardPhoto;
      await saveCreds();
      pendingWizardPhoto = null;
      SETUP_WIZARD.step = 2;
      render();
      return;
    }
    if(step===2){
      const p1 = document.getElementById('wizardPass1').value;
      const p2 = document.getElementById('wizardPass2').value;
      if(p1 || p2){
        if(p1.length < 3){ showToast('የይለፍ ቃል ቢያንስ 3 ፊደል ይሁን'); return; }
        if(p1 !== p2){ showToast('ሁለቱ የይለፍ ቃሎች አይመሳሰሉም'); return; }
        ADMIN.password = p1;
        await saveCreds();
        showToast('ቋሚ የይለፍ ቃል ተቀይሯል');
      }
      SETUP_WIZARD.step = 3;
      render();
      return;
    }
    if(step===3){
      const p1 = document.getElementById('wizardPin1').value.trim();
      const p2 = document.getElementById('wizardPin2').value.trim();
      if(p1 || p2){
        if(!/^\d{4,6}$/.test(p1)){ showToast('ኮዱ ከ4 እስከ 6 ቁጥር ብቻ መሆን አለበት'); return; }
        if(p1 !== p2){ showToast('ሁለቱ ኮዶች አይመሳሰሉም'); return; }
        ADMIN.pinCode = p1;
        await saveCreds();
        showToast('ፈጣን ኮድ ተመዝግቧል');
      }
      SETUP_WIZARD.step = 4;
      render();
      return;
    }
    if(step===4){
      const questions = [];
      for(let i=0;i<3;i++){
        const q = document.getElementById('wizardQ'+i).value.trim();
        const a = document.getElementById('wizardA'+i).value.trim();
        if(!q || !a){ showToast('እባክዎ ሁሉንም 3 ጥያቄዎችና መልሶች ይሙሉ'); return; }
        questions.push({question:q, answer:a});
      }
      ADMIN.securityQuestions = questions;
      ADMIN.setupComplete = true;
      await saveCreds();
      SETUP_WIZARD = null;
      render();
      showToast('የስርዓት ደህንነት ማዋቀሪያ ተጠናቋል!');
      return;
    }
  };

  const registerFpBtn = document.getElementById('registerFpBtn');
  if(registerFpBtn) registerFpBtn.onclick = registerFingerprint;
  const removeFpBtn = document.getElementById('removeFpBtn');
  if(removeFpBtn) removeFpBtn.onclick = removeFingerprint;
  const savePinBtn = document.getElementById('savePinBtn');
  if(savePinBtn) savePinBtn.onclick = savePin;
  const removePinBtn = document.getElementById('removePinBtn');
  if(removePinBtn) removePinBtn.onclick = removePin;
  const downloadBackupBtn = document.getElementById('downloadBackupBtn');
  if(downloadBackupBtn) downloadBackupBtn.onclick = downloadFullBackup;
  const restoreBackupInput = document.getElementById('restoreBackupInput');
  if(restoreBackupInput) restoreBackupInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(file) restoreFromBackupFile(file);
    e.target.value = '';
  };

  const viewModalBg = document.getElementById('viewModalBg');
  if(viewModalBg) viewModalBg.onclick = (e)=>{ if(e.target.id==='viewModalBg'){ viewState=null; render(); } };
  const viewClose = document.getElementById('viewClose');
  if(viewClose) viewClose.onclick = ()=>{ viewState=null; render(); };
  const viewEditBtn = document.getElementById('viewEditBtn');
  if(viewEditBtn) viewEditBtn.onclick = ()=>{
    const record = DATA[viewState.entity].find(r=>r.id===viewState.id);
    if(viewState.entity==='academics'){
      historyState = {childId: record.childId, formOpen:true, editingId: record.id};
      viewState = null;
      pendingAcadDoc = null;
      render();
      return;
    }
    pendingPhoto=null; pendingDocs={};
    modalState = {entity:viewState.entity, mode:'edit', record};
    viewState=null;
    render();
  };
  const viewExportBtn = document.getElementById('viewExportBtn');
  if(viewExportBtn) viewExportBtn.onclick = ()=>{
    const record = DATA[viewState.entity].find(r=>r.id===viewState.id);
    exportRecordToExcel(viewState.entity, record);
  };

  function doIdSearch(){
    const inputEl = document.getElementById('idSearchInput');
    if(!inputEl) return;
    const raw = inputEl.value.trim();
    ID_SEARCH_QUERY = raw;
    const q = raw.toLowerCase();
    if(!q){ ID_SEARCH_RESULT=null; render(); return; }
    let found = null;
    for(const entity of ['staff','children']){
      const rec = DATA[entity].find(r=>(r.regId||'').toLowerCase()===q);
      if(rec){ found = {entity, record:rec}; break; }
    }
    ID_SEARCH_RESULT = found || 'notfound';
    render();
  }
  const idSearchBtn = document.getElementById('idSearchBtn');
  if(idSearchBtn) idSearchBtn.onclick = doIdSearch;
  const idSearchInput = document.getElementById('idSearchInput');
  if(idSearchInput){
    idSearchInput.focus();
    idSearchInput.setSelectionRange(idSearchInput.value.length, idSearchInput.value.length);
    idSearchInput.addEventListener('keydown', e=>{ if(e.key==='Enter') doIdSearch(); });
  }
  const idResultEditBtn = document.getElementById('idResultEditBtn');
  if(idResultEditBtn) idResultEditBtn.onclick = ()=>{
    const {entity, record} = ID_SEARCH_RESULT;
    pendingPhoto=null; pendingDocs={};
    modalState = {entity, mode:'edit', record};
    render();
  };
  const idResultExportBtn = document.getElementById('idResultExportBtn');
  if(idResultExportBtn) idResultExportBtn.onclick = ()=>{
    const {entity, record} = ID_SEARCH_RESULT;
    exportRecordToExcel(entity, record);
  };

  const exportAllWorkbookBtn = document.getElementById('exportAllWorkbookBtn');
  if(exportAllWorkbookBtn) exportAllWorkbookBtn.onclick = exportAllToWorkbook;
  document.querySelectorAll('[data-copy-record]').forEach(el=>{
    el.onclick = ()=>{
      const [entityKey, id] = el.getAttribute('data-copy-record').split(':');
      copyRecordToClipboard(entityKey, id);
    };
  });
  document.querySelectorAll('[data-export-record]').forEach(el=>{
    el.onclick = ()=>{
      const [entityKey, id] = el.getAttribute('data-export-record').split(':');
      const rec = DATA[entityKey].find(r=>r.id===id);
      if(rec) exportRecordToExcel(entityKey, rec);
    };
  });
  document.querySelectorAll('[data-export-section]').forEach(el=>{
    el.onclick = ()=> exportSectionToExcel(el.getAttribute('data-export-section'));
  });
  initOverviewCharts();
}

/* ---------- init ---------- */
loadAll();
</script>
</body>
</html>
